name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Content schema validation
        run: pnpm content:validate

      - name: Build
        run: pnpm build

      - name: Secret scan (basic)
        run: |
          set +e
          matches=$(grep -RInE --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next --exclude-dir=coverage \
            -e 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'ghp_[A-Za-z0-9]{36}' \
            -e 'xox[baprs]-[A-Za-z0-9-]{10,}' . || true)
          set -e
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Potential secrets detected"
            exit 1
          fi
          echo "Basic secret scan passed"
