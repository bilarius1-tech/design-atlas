# Production https://design.vaybik.ru — compose project design-atlas.
# Traefik labels only. Do not publish ports. Do not edit /opt/proxy.
# Values come from .env (APP_NAME, APP_HOST, APP_PORT, NEXT_PUBLIC_SITE_URL).

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://design.vaybik.ru}
    image: ${APP_NAME:-design-atlas}:latest
    container_name: ${APP_NAME:-design-atlas}
    restart: unless-stopped
    mem_limit: 512m
    env_file: [.env]
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://design.vaybik.ru}
      PORT: ${APP_PORT:-3000}
      HOSTNAME: 0.0.0.0
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.${APP_NAME:-design-atlas}.loadbalancer.server.port=${APP_PORT:-3000}
      - traefik.http.routers.${APP_NAME:-design-atlas}.rule=Host(`${APP_HOST:-design.vaybik.ru}`)
      - traefik.http.routers.${APP_NAME:-design-atlas}.entrypoints=websecure
      - traefik.http.routers.${APP_NAME:-design-atlas}.tls.certresolver=le
      - traefik.http.routers.${APP_NAME:-design-atlas}-http.rule=Host(`${APP_HOST:-design.vaybik.ru}`)
      - traefik.http.routers.${APP_NAME:-design-atlas}-http.entrypoints=web
      - traefik.http.routers.${APP_NAME:-design-atlas}-http.middlewares=to-https@docker
      - traefik.http.routers.${APP_NAME:-design-atlas}-http.service=${APP_NAME:-design-atlas}
      - vaybik.managed=true

networks:
  proxy:
    external: true
